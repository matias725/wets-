<!doctype html>
<html lang="es-CL" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <title>WEST IA · Gestión de flota</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un parpadeo claro/oscuro.
      try {
        if (localStorage.getItem('westia.theme') === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
